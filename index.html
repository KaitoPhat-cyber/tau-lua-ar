<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tàu Lửa AR</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      height: 100dvh;
      overflow: hidden;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      background-color: #0f172a;
      --poster-color: transparent;
    }
    .top-hint {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 13px;
      text-align: center;
      width: max-content;
      max-width: 90vw;
      z-index: 10;
    }
    #ar-button {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      color: #ffffff;
      border: none;
      border-radius: 999px;
      padding: 14px 26px;
      font-size: 16px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.45);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      z-index: 10;
    }
    #ar-button:active {
      transform: translateX(-50%) scale(0.96);
    }
  </style>
</head>
<body>
  <div class="top-hint">
    Vuốt để xoay 3D • Bấm nút bên dưới để đưa tàu ra không gian thật
  </div>

  <model-viewer
    id="train-viewer"
    src="tau-lua.glb"
    alt="Mô hình 3D chuyến tàu lửa đang chạy"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="auto"
    ar-placement="floor"
    camera-controls
    touch-action="pan-y"
    autoplay
    shadow-intensity="1"
    exposure="1"
    environment-image="neutral"
  >
    <button slot="ar-button" id="ar-button">
      🚆 Xem trong không gian thực (AR)
    </button>
  </model-viewer>

  <script>
    const viewer = document.querySelector('#train-viewer');
    viewer.addEventListener('load', () => {
      if (viewer.availableAnimations && viewer.availableAnimations.length > 0) {
        viewer.animationName = viewer.availableAnimations[0];
        viewer.play();
      }
    });
  </script>
</body>
</html>
